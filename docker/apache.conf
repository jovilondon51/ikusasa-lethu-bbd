<Directory /var/www/html>
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
    <FilesMatch "^(\.|Dockerfile$|README\.md$|.*\.(yml|yaml|sql|pem|ini|sh)$)">
        Require all denied
    </FilesMatch>
</Directory>
<DirectoryMatch "^/var/www/html/(config|includes|scripts|database|tests|docker|uploads|\.git|\.github)(/|$)">
    Require all denied
</DirectoryMatch>
ServerTokens Prod
ServerSignature Off
